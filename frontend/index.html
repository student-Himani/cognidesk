<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="CogniDesk — Intelligent AI Knowledge & Document Workspace with In-Browser Local Storage, Semantic Search, and Offline AI." />
    <title>CogniDesk — AI Knowledge & Document Workspace</title>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; padding: 0;" class="bg-slate-950 text-slate-100 antialiased font-sans h-full w-full overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden">
      <div style="display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background-color:#020617;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div style="width:36px;height:36px;border:3px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:cogni-spin 0.8s linear infinite;"></div>
          <span style="font-size:14px;letter-spacing:0.05em;color:#cbd5e1;font-weight:500;">Loading CogniDesk...</span>
        </div>
      </div>
    </div>
    <style>@keyframes cogni-spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="/src/main.tsx"></script>
