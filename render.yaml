# ==============================================================================
# Render Blueprint Configuration (CogniDesk Free Web & Python Backend)
# ==============================================================================
services:
  # Backend Web API Service (Python Free Tier)
  - type: web
    name: cognidesk-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: COGNIDESK_HOSTED_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cognidesk-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://cognidesk.onrender.com
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: HOSTED_LLM_PROVIDER
        value: groq
      - key: HOSTED_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Static Web Frontend
  - type: web
    name: cognidesk-web
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cognidesk-api.onrender.com/api/v1

databases:
  - name: cognidesk-postgres
    databaseName: cognidesk_db
    user: cognidesk_user
    plan: free
    region: oregon
