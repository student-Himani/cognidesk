# ==============================================================================
# Render Blueprint Configuration (Module 31 — CogniDesk Web)
# ==============================================================================
services:
  # Backend Web API Service
  - type: web
    name: cognidesk-api
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: COGNIDESK_HOSTED_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cognidesk-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://cognidesk.onrender.com
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: HOSTED_LLM_PROVIDER
        value: groq
      - key: HOSTED_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # Static Web Frontend
  - type: web
    name: cognidesk-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cognidesk-api.onrender.com/api/v1

databases:
  - name: cognidesk-postgres
    databaseName: cognidesk_db
    user: cognidesk_user
    plan: starter
    region: oregon
