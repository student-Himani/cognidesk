name: CogniDesk Frontend CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm ci || npm install

      - name: Validate TypeScript compilation
        run: |
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          npm run build

      - name: Report CI Failure Diagnostics
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ FRONTEND CI PIPELINE FAILED"
          echo "================================================================="
          echo "TypeScript compilation or Vite production bundle build failed."
          echo "Review the error log above to identify invalid types or syntax."
          echo "To reproduce and debug locally, execute:"
          echo "  cd frontend"
          echo "  npm run build"
          echo "================================================================="
          exit 1
