name: CogniDesk Backend CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: backend:.
      ENVIRONMENT: test
      SQLITE_DB_PATH: database/cognidesk_test.db
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      CHROMA_PERSIST_DIRECTORY: ./vector_db_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (OpenCV / EasyOCR headless support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize local storage directories
        run: |
          mkdir -p database uploads vector_db

      - name: Run Pytest test suite
        run: |
          pytest -v --tb=short

      - name: Report CI Failure Diagnostics
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ BACKEND CI PIPELINE FAILED"
          echo "================================================================="
          echo "One or more backend tests failed in pytest."
          echo "Review the pytest traceback above to locate the failing test case."
          echo "To reproduce and debug locally, execute:"
          echo "  pytest -v --tb=short"
          echo "================================================================="
          exit 1
